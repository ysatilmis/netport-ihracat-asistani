<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetPort AI — LinkedIn Görseli</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 627px;
    background: #0A1628;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Grid texture */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 80%, rgba(30, 144, 255, 0.08) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(30, 144, 255, 0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Top accent line */
  .accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #1E90FF 30%, #4DB8FF 60%, transparent 100%);
  }

  .container {
    position: relative;
    text-align: center;
    padding: 60px 100px;
    z-index: 1;
  }

  /* Main headline */
  .headline {
    font-size: 82px;
    font-weight: 900;
    color: #FFFFFF;
    letter-spacing: -2px;
    line-height: 1.05;
    margin-bottom: 32px;
    text-shadow: 0 2px 40px rgba(255,255,255,0.1);
  }

  .headline .quote-mark {
    color: #1E90FF;
    font-size: 90px;
  }

  /* Divider */
  .divider {
    width: 60px;
    height: 2px;
    background: #1E90FF;
    margin: 0 auto 28px;
    border-radius: 2px;
  }

  /* Subtext */
  .subtext {
    font-size: 30px;
    font-weight: 400;
    color: #A0B4C8;
    letter-spacing: 0.3px;
    line-height: 1.4;
  }

  .subtext strong {
    color: #4DB8FF;
    font-weight: 700;
  }

  /* Domain badge — bottom right */
  .domain {
    position: absolute;
    bottom: 32px;
    right: 48px;
    font-size: 18px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 1px;
    text-transform: lowercase;
  }

  /* AI tag — top left */
  .tag {
    position: absolute;
    top: 32px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    color: #1E90FF;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .tag::before {
    content: '';
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #1E90FF;
    border-radius: 50%;
    box-shadow: 0 0 12px #1E90FF;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }

  /* Bottom left — small caption */
  .caption {
    position: absolute;
    bottom: 36px;
    left: 48px;
    font-size: 14px;
    color: rgba(160, 180, 200, 0.5);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="accent-line"></div>

  <div class="tag">İhracat × Yapay Zeka</div>

  <div class="container">
    <div class="headline">
      <span class="quote-mark">"</span>Yanlış ülkeye<br>girdik.<span class="quote-mark">"</span>
    </div>
    <div class="divider"></div>
    <div class="subtext">
      <strong>NetPort AI</strong> ile bu artık önlenebilir.
    </div>
  </div>

  <div class="domain">netportai.com</div>
  <div class="caption">Pazar araştırması · Dakikalar içinde</div>
</body>
</html>
